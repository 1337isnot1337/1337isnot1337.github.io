name: Publish project shelf
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the public research catalogue without cross-repository credentials.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Package mirrors can be slow; browser checks remain mandatory.
    timeout-minutes: 30
    steps:
      - name: Check out the project shelf
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check out the current conjecture collection
        uses: actions/checkout@v7
        with:
          repository: 1337isnot1337/solved-conjectures
          # Preview only: use the exact source of the last successful live build.
          ref: d0baa69c2eb911888d9d93ef6efec707a9a86630
          fetch-depth: 0
          path: _sources/solved-conjectures
          persist-credentials: false
      - name: Install the Markdown renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc
      - name: Build and check the research catalogue
        run: |
          python3 _sources/solved-conjectures/scripts/build_site.py \
            --output "$GITHUB_WORKSPACE/site/solved-conjectures" \
            --base-url https://1337isnot1337.github.io/solved-conjectures/
          python3 _sources/solved-conjectures/scripts/check_site.py \
            "$GITHUB_WORKSPACE/site/solved-conjectures"
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check browser system dependencies
        run: |
          # Hosted Ubuntu already supplies most libraries. Only use the package
          # mirror when a real launch needs it; all browser tests still follow.
          if ! node -e 'require("playwright").chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exit(1); })'; then
            npx playwright install-deps chromium
          fi
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
      - name: Upload the complete website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
