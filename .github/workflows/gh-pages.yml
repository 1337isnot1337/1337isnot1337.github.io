name: Publish project shelf
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      isolated_runner:
        description: Use temporary runners registered for this release
        type: boolean
        default: false
  schedule:
    # Check for a new source revision every 15 minutes, without cross-repository credentials.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ inputs.isolated_runner && format('itsdavis-pages-{0}', github.run_id) || 'ubuntu-latest' }}
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Check live source and website revisions
        id: check
        env:
          EVENT: ${{ github.event_name }}
          WEBSITE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          needed = True
          if os.environ["EVENT"] == "schedule":
              try:
                  sha = subprocess.check_output(
                      ["git", "ls-remote", "https://github.com/1337isnot1337/solved-conjectures.git", "refs/heads/main"],
                      text=True, timeout=20,
                  ).split()[0]
                  root = "https://itsdavis.com/solved-conjectures/"
                  def read(name):
                      request = urllib.request.Request(root + name + "?source=" + sha, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          return json.load(response)
                  p = read("catalogue-provenance.json")
                  m = read("build-manifest.json")
                  needed = not (
                      p.get("mode") == "current"
                      and p.get("current_catalogue_validation") == "passed"
                      and p.get("attempted_source", {}).get("commit") == sha
                      and p.get("rendered_source", {}).get("commit") == sha
                      and p.get("website_commit") == os.environ["WEBSITE_SHA"]
                      and m.get("source_commit") == sha
                      and m.get("source_dirty") is False
                  )
              except Exception as error:
                  print("Could not establish freshness; rebuild:", error)
          print("Refresh needed:", needed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("needed=" + str(needed).lower() + "\n")
          PY

  build:
    needs: refresh
    if: needs.refresh.outputs.needed == 'true'
    runs-on: ${{ inputs.isolated_runner && format('itsdavis-pages-{0}', github.run_id) || 'ubuntu-24.04' }}
    outputs:
      catalogue_commit: ${{ steps.catalogue.outputs.commit }}
      catalogue_mode: ${{ steps.catalogue.outputs.mode }}
    # Package mirrors can be slow; browser checks remain mandatory.
    timeout-minutes: 30
    steps:
      - name: Check out the project shelf
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check out the current conjecture collection
        uses: actions/checkout@v7
        with:
          repository: 1337isnot1337/solved-conjectures
          ref: main
          fetch-depth: 0
          path: _sources/solved-conjectures
          persist-credentials: false
      - name: Read the reviewed catalogue snapshot revision
        id: snapshot
        run: |
          python3 -c 'import json, os; c=json.load(open("scripts/catalogue_snapshot.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("sha=" + c["source_commit"] + "\n")'
      - name: Check out the immutable catalogue snapshot
        uses: actions/checkout@v7
        with:
          repository: 1337isnot1337/solved-conjectures
          ref: ${{ steps.snapshot.outputs.sha }}
          fetch-depth: 0
          path: _sources/catalogue-snapshot
          persist-credentials: false
      - name: Install the Markdown renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc
      - name: Build and check the research catalogue
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/catalogue_release_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_catalogue.py \
            --source _sources/solved-conjectures \
            --fallback-source _sources/catalogue-snapshot \
            --output "$GITHUB_WORKSPACE/site/solved-conjectures" \
            --base-url https://itsdavis.com/solved-conjectures/
      - name: Record exact deployment provenance
        id: catalogue
        env:
          WEBSITE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path("site/solved-conjectures/catalogue-provenance.json")
          p = json.loads(path.read_text())
          sha = subprocess.check_output(["git", "-C", "_sources/solved-conjectures", "rev-parse", "HEAD"], text=True).strip()
          if p["attempted_source"]["commit"] != sha:
              raise SystemExit("Catalogue attempted source does not match the checkout")
          p["website_commit"] = os.environ["WEBSITE_SHA"]
          path.write_text(json.dumps(p, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("commit=" + sha + "\n")
              out.write("mode=" + p["mode"] + "\n")
          PY
      - name: Generate research notes directory from the validated catalogue
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_research_notes_index.py \
            --catalogue "$GITHUB_WORKSPACE/site/solved-conjectures" \
            --output "$GITHUB_WORKSPACE/site/research-notes/index.html"
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check browser system dependencies
        run: |
          # Hosted Ubuntu already supplies most libraries. Only use the package
          # mirror when a real launch needs it; all browser tests still follow.
          if ! node -e 'require("playwright").chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exit(1); })'; then
            npx playwright install-deps chromium
          fi
      - run: npm run test:browser
      - name: Build the plain-text index and Markdown companions
        run: node scripts/build_discovery.cjs
      - name: Add Cloudflare Web Analytics to the published HTML
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        run: node scripts/build_analytics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
      - name: Upload the complete website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: build
    runs-on: ${{ inputs.isolated_runner && format('itsdavis-pages-{0}', github.run_id) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy

  catalogue-freshness:
    needs: [build, publish]
    runs-on: ${{ inputs.isolated_runner && format('itsdavis-pages-{0}', github.run_id) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify the live catalogue matches the validated source
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.catalogue_commit }}
          CATALOGUE_MODE: ${{ needs.build.outputs.catalogue_mode }}
          WEBSITE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          if os.environ["CATALOGUE_MODE"] != "current":
              raise SystemExit("A dated fallback was deployed: current catalogue validation did not pass.")
          sha = os.environ["EXPECTED_SHA"]
          website_sha = os.environ["WEBSITE_SHA"]
          root = "https://itsdavis.com/solved-conjectures/"
          for attempt in range(12):
              try:
                  def read(name):
                      url = root + name + "?deploy=" + os.environ["GITHUB_RUN_ID"] + "-" + str(attempt)
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=10) as response:
                          return json.load(response)
                  p = read("catalogue-provenance.json")
                  m = read("build-manifest.json")
                  if (p.get("mode") == "current"
                      and p.get("current_catalogue_validation") == "passed"
                      and p.get("attempted_source", {}).get("commit") == sha
                      and p.get("rendered_source", {}).get("commit") == sha
                      and p.get("website_commit") == website_sha
                      and m.get("source_commit") == sha
                      and m.get("source_dirty") is False):
                      print("Verified live catalogue source:", sha)
                      break
                  print("Live revision has not caught up:", p.get("rendered_source"), m.get("source_commit"))
              except Exception as error:
                  print("Could not verify live release:", error)
              time.sleep(10)
          else:
              raise SystemExit("Live catalogue did not match the validated deployment")
          PY
