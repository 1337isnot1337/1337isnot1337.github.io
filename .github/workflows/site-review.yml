name: Review incident case note
on:
  push:
    branches: [site-incident-review-20261119]

permissions:
  contents: read

concurrency:
  group: incident-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Package mirrors can be slow; browser checks remain mandatory.
    timeout-minutes: 30
    steps:
      - name: Check out the project shelf
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check out the current conjecture collection
        uses: actions/checkout@v7
        with:
          repository: 1337isnot1337/solved-conjectures
          ref: main
          fetch-depth: 0
          path: _sources/solved-conjectures
          persist-credentials: false
      - name: Read the reviewed catalogue snapshot revision
        id: snapshot
        run: |
          python3 -c 'import json, os; c=json.load(open("scripts/catalogue_snapshot.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("sha=" + c["source_commit"] + "\n")'
      - name: Check out the immutable catalogue snapshot
        uses: actions/checkout@v7
        with:
          repository: 1337isnot1337/solved-conjectures
          ref: ${{ steps.snapshot.outputs.sha }}
          fetch-depth: 0
          path: _sources/catalogue-snapshot
          persist-credentials: false
      - name: Install the Markdown renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc
      - name: Build and check the research catalogue
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/catalogue_release_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_catalogue.py \
            --source _sources/solved-conjectures \
            --fallback-source _sources/catalogue-snapshot \
            --output "$GITHUB_WORKSPACE/site/solved-conjectures" \
            --base-url https://1337isnot1337.github.io/solved-conjectures/
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check browser system dependencies
        run: |
          # Hosted Ubuntu already supplies most libraries. Only use the package
          # mirror when a real launch needs it; all browser tests still follow.
          if ! node -e 'require("playwright").chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exit(1); })'; then
            npx playwright install-deps chromium
          fi
      - run: npm run test:browser
      - name: Preserve Chromium screenshots
        run: cp -a test-results test-results-chromium
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Check WebKit
        run: BROWSER=webkit npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            test-results/
            test-results-chromium/
          retention-days: 7
