<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="grid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feFlood x="0" y="0" width="2" height="2" flood-opacity="0" result="empty"/>
    <feFlood x="0" y="0" width="1" height="1" result="dot"/>
    <feComposite in="dot" in2="empty" operator="over" x="0" y="0" width="2" height="2" result="cell"/>
    <feTile in="cell" result="matrix"/>
    <feComposite in="SourceGraphic" in2="matrix" operator="in" result="sample"/>
    <feOffset in="sample" dx="1" dy="0" result="east"/>
    <feOffset in="sample" dx="0" dy="1" result="south"/>
    <feOffset in="sample" dx="1" dy="1" result="corner"/>
    <feMerge result="pixels">
      <feMergeNode in="sample"/>
      <feMergeNode in="east"/>
      <feMergeNode in="south"/>
      <feMergeNode in="corner"/>
    </feMerge>
    <feComponentTransfer in="pixels" result="softened">
      <feFuncA type="linear" slope=".42"/>
    </feComponentTransfer>
    <feComposite in="softened" in2="SourceGraphic" operator="over"/>
  </filter>
</svg>
